<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');

    body {
        background-color: #f3e9e0;
    }

    table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        border-radius: 16px;
        overflow: hidden;
        background: white;
        box-shadow: 0 10px 16px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
    }

    thead tr {
        background-color: #a8e6cf;
    }

    tr,
    td {
        font-family: 'Poppins', sans-serif;
        font-size: 18px;
        text-align: center;
        padding: 10px;
        color: black;
    }

    tr:nth-child(even) {
        background: whitesmoke;
    }

    img {
        width: 100%;
    }

    .logo-container {
        max-width: 200px;
        width: 100%;
        padding-bottom: 20px;
    }

    .state-completed {
        background-color: lightgreen;
    }

    h1 {
        font-family: "Inter", system-ui, sans-serif;
        color: crimson;
    }

    .td-done {
        width: 100%;
        height: 25px;
        background-color: lightgreen;
        border-radius: 14px;
    }

    .main-container {
        display: flex;
        gap: 10px;
        align-items: flex-start;
    }

    #main-table {
        flex: 1;
    }

    #finished-tasks-table {
        flex: 1;
    }

    #main-table,
    #finished-tasks-table {
        min-width: 0;
    }

    .header-container {
        display: flex;
        gap: 300px;
    }

    /* Solid amber for an operation somebody is on, whether it is running or
       paused: from across a workshop the useful distinction is finished,
       started, not started. Sized and aligned to sit level with the tick. */
    .op-running,
    .op-paused {
        display: inline-block;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #f59e0b;
        vertical-align: middle;
    }

    td i[data-lucide] svg,
    td svg {
        vertical-align: middle;
    }
</style>

<body>

    <div class="header-container">
        <div class="logo-container">
            <img src="keralogo.png" />
        </div>
        <div>
            <p style="font-size: 30px;">J&auml;rjekord n&auml;dalates: <span id="queue-in-weeks">0</span></p>
        </div>
        <div>
            <p style="font-size: 30px;">Luuke kokku: <span id="total-hatches-amount">0</span></p>
        </div>
    </div>

    <div class="main-container">

        <table id="main-table">
            <thead>
                <tr>
                    <td>Nr.</td>
                    <td>Mat.</td>
                    <td>SO</td>
                    <td>Objekt</td>
                    <td width="900">T&ouml;&ouml;k&auml;sk</td>
                    <td>Tk</td>
                    <td>L</td>
                    <td>N</td>
                    <td>P</td>
                    <td>K</td>
                    <td>Puudused</td>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>

        <table id="finished-tasks-table">
            <thead>
                <tr>
                    <td>Nr.</td>
                    <td>Mat.</td>
                    <td>SO</td>
                    <td>Objekt</td>
                    <td>T&ouml;&ouml;k&auml;sk</td>
                    <td>Tk</td>
                    <td>Valmis</td>
                    <td>Puudused</td>
                </tr>
            </thead>
            <tbody>

            </tbody>
        </table>

    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="init.js"></script>

</body>

<script type="module">
    import { getOrders, isFinishedOrder } from "./data-helper.js";

    // Declared before the first call: two counts can overlap and a slow
    // older answer must not repaint over a newer one.
    let countSeq = 0;

    // Armed before the first count, so one failed read does not leave the
    // screen without a counter until somebody reloads the browser.
    setInterval(calculateData, 10000);

    await calculateData().catch(err => console.error("queue counter failed", err));

    async function calculateData() {


        const seq = ++countSeq;

        let orders = await getOrders();
        if (seq !== countSeq) return;

        let totalAmount = 0;
        for (let order of orders) {

            if (order.getStatus() != null) {
                if (order.getStatus().toLowerCase() == "x") {
                    continue;
                }
            }

            // Same finished test the tables use, so the queue cannot count
            // work the board has already taken off.
            if (!isFinishedOrder(order) && !order.isRemoved())
                totalAmount += order.getAmount();
        }

        let queueInWeeks = totalAmount / 55;

        document.getElementById("queue-in-weeks").innerText = queueInWeeks.toFixed(1);
        document.getElementById("total-hatches-amount").innerText = totalAmount;
    }
</script>

</html>
